[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binh13_analyzer"
version = "1.0.0"
description = "Binh 13 (Mậu Binh / Chinese Poker) Computer Vision & Monte Carlo EV Analyzer for macOS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Antigravity Engineering Team"}
]
dependencies = [
    "numpy>=2.0.0",
    "PySide6>=6.8.0",
    "opencv-python>=4.10.0",
    "Pillow>=10.0.0",
    "onnxruntime>=1.19.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.10.0"
]

[project.scripts]
binh13-analyzer = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --strict-markers"
